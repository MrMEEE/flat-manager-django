name: Build RPM

# ── Run on version tags, or manually via the GitHub Actions UI ────────────────
on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.8.7) — must be an existing tag'
        required: true
        type: string

permissions:
  contents: write   # needed to create GitHub Releases

env:
  # Proactively run JavaScript-based actions on Node.js 24 before
  # GitHub's forced migration date, so any incompatibilities are caught early.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  build-rpm:
    name: RPM — ${{ matrix.distro_label }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - distro_label:  RHEL 9 / UBI 9
            container:     registry.access.redhat.com/ubi9/ubi:latest
            artifact_name: rhel-9
            python_pkg:    "python3.11 python3.11-devel"
            rhel_ver:      9

          - distro_label:  RHEL 10 / UBI 10
            container:     registry.access.redhat.com/ubi10/ubi:latest
            artifact_name: rhel-10
            python_pkg:    "python3 python3-devel"
            rhel_ver:      10

    steps:
      # ── Checkout source ─────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # GitHub's job-level container runner forcibly adds --entrypoint "tail".
      # That breaks on the CentOS Stream 10 base image, which does not contain tail.
      # Instead, we start the distro container explicitly with our own entrypoint.
      - name: Start distro container
        run: |
          docker rm -f rpmbuild-${{ matrix.artifact_name }} >/dev/null 2>&1 || true
          docker run -d --privileged \
            --name rpmbuild-${{ matrix.artifact_name }} \
            --workdir /workspace \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            --entrypoint /bin/bash \
            ${{ matrix.container }} \
            -lc 'sleep infinity'

      # ── Install build toolchain ─────────────────────────────────────────────
      - name: Install build dependencies
        run: |
          docker exec rpmbuild-${{ matrix.artifact_name }} bash -lc '
            dnf install -y https://dl.fedoraproject.org/pub/epel/epel-release-latest-${{ matrix.rhel_ver }}.noarch.rpm
            dnf install -y "dnf-command(config-manager)" 2>/dev/null || true
            dnf config-manager --set-enabled crb 2>/dev/null || \
            dnf config-manager --set-enabled powertools 2>/dev/null || true

            cat > /etc/yum.repos.d/centos-stream-bubblewrap.repo <<EOF
[centos-stream-baseos]
name=CentOS Stream ${{ matrix.rhel_ver }} BaseOS
baseurl=https://mirror.stream.centos.org/${{ matrix.rhel_ver }}-stream/BaseOS/x86_64/os/
enabled=1
gpgcheck=0
repo_gpgcheck=0
priority=20

[centos-stream-appstream]
name=CentOS Stream ${{ matrix.rhel_ver }} AppStream
baseurl=https://mirror.stream.centos.org/${{ matrix.rhel_ver }}-stream/AppStream/x86_64/os/
enabled=1
gpgcheck=0
repo_gpgcheck=0
priority=20
EOF

            dnf install -y \
              rpm-build \
              rpmdevtools \
              git \
              gcc \
              gcc-c++ \
              rust \
              cargo \
              mariadb-connector-c-devel \
              bubblewrap \
              checkpolicy \
              policycoreutils \
              ${{ matrix.python_pkg }}

            rpmdev-setuptree
          '

      # actions/checkout runs as the runner UID; the container runs as root.
      # Git refuses to operate on the repo unless we mark it safe explicitly.
      - name: Mark workspace as git safe directory
        run: docker exec rpmbuild-${{ matrix.artifact_name }} git config --global --add safe.directory /workspace

      # ── Determine version from tag or manual input ──────────────────────────
      - name: Determine version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION}"

      # ── Create source tarball ───────────────────────────────────────────────
      - name: Create source tarball
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          TARBALL="${RUNNER_TEMP}/flat-manager-django-${VERSION}.tar.gz"
          git archive \
            --format=tar.gz \
            --prefix="flat-manager-django-${VERSION}/" \
            HEAD \
            > "${TARBALL}"
          docker exec rpmbuild-${{ matrix.artifact_name }} mkdir -p /root/rpmbuild/SOURCES
          docker cp "${TARBALL}" "rpmbuild-${{ matrix.artifact_name }}:/root/rpmbuild/SOURCES/"
          docker exec rpmbuild-${{ matrix.artifact_name }} ls -lh /root/rpmbuild/SOURCES

      # ── Build RPMs (app + python-libs) ──────────────────────────────────────
      - name: Build RPMs
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          docker exec rpmbuild-${{ matrix.artifact_name }} rpmbuild -ba /workspace/packaging/flat-manager-django.spec \
            --define "version_string ${VERSION}" \
            --define "_topdir /root/rpmbuild" \
            --define "rhel ${{ matrix.rhel_ver }}"

      # ── Copy built RPMs out ─────────────────────────────────────────────────
      - name: Collect built RPMs
        run: |
          mkdir -p rpm-output
          docker cp rpmbuild-${{ matrix.artifact_name }}:/root/rpmbuild/RPMS/. rpm-output/
          find rpm-output -name '*.rpm' | sort

      # ── Upload as workflow artefact ─────────────────────────────────────────
      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "rpms-${{ matrix.artifact_name }}"
          path: rpm-output/**/*.rpm
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    needs: build-rpm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all RPM artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-rpms/

      - name: List release assets
        run: find release-rpms/ -name '*.rpm' | sort

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          files: release-rpms/**/*.rpm
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name, '-') }}
          fail_on_unmatched_files: true
          body: |
            ## Installation

            Choose the correct RPM for your distribution:

            | File pattern | Target |
            |---|---|
            | `*el9*.rpm` | CentOS Stream 9 / RHEL 9 |
            | `*el10*.rpm` | CentOS Stream 10 / RHEL 10 |

            Each release produces three RPMs per distro:
            - **`flat-manager-django-*`** — application source, systemd units, nginx config
            - **`flat-manager-django-python-libs-*`** — pre-built Python virtualenv (compiled extensions)
            - **`flat-manager-django-client-*`** — check-in agent for client machines (noarch)

            Install the server:
            ```
            dnf install flat-manager-django-<version>.rpm \
                        flat-manager-django-python-libs-<version>.rpm
            ```

            Install the client agent on machines consuming the repositories:
            ```
            dnf install flat-manager-django-client-<version>.noarch.rpm
            # Edit config:
            vi /etc/flat-manager-django-client/config
            # Run manually or add to cron:
            flat-manager-checkin
            ```

            ### First-time server setup
            ```
            # 1. Edit the environment file
            vi /etc/flat-manager/flat-manager.env

            # 2. Run database migrations
            flat-manager-manage migrate

            # 3. Create an admin user
            flat-manager-manage createsuperuser

            # 4. Start services
            systemctl enable --now nginx flat-manager.target
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
