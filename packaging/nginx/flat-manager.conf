# flat-manager-django — nginx reverse-proxy configuration
# Place in /etc/nginx/conf.d/flat-manager.conf
#
# Required customisation:
#   server_name — set to your FQDN (two places below)
#
# Certificates (self-signed snakeoil active by default):
#   Generate snakeoil cert:
#     openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
#       -keyout /etc/pki/tls/private/flat-manager.key \
#       -out    /etc/pki/tls/certs/flat-manager.crt \
#       -subj "/CN=your.server.hostname"
#
#   Switch to Let's Encrypt (recommended for public servers):
#     dnf install -y certbot python3-certbot-nginx
#     certbot --nginx -d your.server.hostname
#     Then comment out the snakeoil lines and uncomment the letsencrypt lines.

upstream flat_manager_asgi {
    server unix:/run/flat-manager/daphne.sock fail_timeout=0;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
# Using 'default_server' ensures this block wins over nginx's built-in
# welcome page even before server_name is set.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;                   # CHANGE_ME: your.server.hostname

    # Allow Let's Encrypt HTTP-01 challenge through before the redirect
    location /.well-known/acme-challenge/ {
        root /var/lib/flat-manager/staticfiles;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;                   # CHANGE_ME: your.server.hostname

    # ── TLS certificates ───────────────────────────────────────────────────
    # Self-signed snakeoil (default — replace with real cert for production):
    ssl_certificate     /etc/pki/tls/certs/flat-manager.crt;
    ssl_certificate_key /etc/pki/tls/private/flat-manager.key;
    # Let's Encrypt — uncomment and comment out lines above once certbot runs:
    # ssl_certificate     /etc/letsencrypt/live/CHANGE_ME/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/CHANGE_ME/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 2G;
    client_body_timeout  300s;

    # ── Static assets (served directly by nginx) ──────────────────────────
    location /static/ {
        alias /var/lib/flat-manager/staticfiles/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /var/lib/flat-manager/media/;
        expires 1d;
        access_log off;
    }

    # ── Flatpak OSTree repository files ───────────────────────────────────
    # These can be large; serve directly and allow range requests.
    location /repositories/ {
        alias /var/lib/flat-manager/repos/;
        autoindex off;
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control "no-cache";
    }

    # ── WebSocket connections ──────────────────────────────────────────────
    location /ws/ {
        proxy_pass         http://flat_manager_asgi;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # ── All other requests → Daphne ───────────────────────────────────────
    location / {
        proxy_pass         http://flat_manager_asgi;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }
}
