# flat-manager-django — nginx reverse-proxy configuration
# Place in /etc/nginx/conf.d/flat-manager.conf
# Adjust 'server_name' to match your hostname.

upstream flat_manager_asgi {
    server unix:/run/flat-manager/daphne.sock fail_timeout=0;
}

server {
    listen 80;
    server_name _;          # Replace _ with your FQDN, e.g.: flatpak.example.com

    client_max_body_size 2G;
    client_body_timeout  300s;

    # ── Static assets (served directly by nginx) ─────────────────────────────
    location /static/ {
        alias /var/lib/flat-manager/staticfiles/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /var/lib/flat-manager/media/;
        expires 1d;
        access_log off;
    }

    # ── Flatpak OSTree repository files ──────────────────────────────────────
    # These can be large; serve directly and allow range requests.
    location /repos/ {
        alias /var/lib/flat-manager/repos/;
        autoindex off;
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control "no-cache";
    }

    # ── WebSocket connections ─────────────────────────────────────────────────
    location /ws/ {
        proxy_pass         http://flat_manager_asgi;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;   # keep WS alive for a day
    }

    # ── All other requests → Daphne ───────────────────────────────────────────
    location / {
        proxy_pass         http://flat_manager_asgi;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }
}
